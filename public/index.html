<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1000 Checkboxes</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');

        :root {
            --bg: #0a0a0f;
            --panel: #10101a;
            --border: #1e1e30;
            --accent: #00ffcc;
            --accent2: #ff2d78;
            --checked: #00ffcc;
            --text: #c0c0d8;
            --dim: #444466;
            --glow: 0 0 8px #00ffcc88;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* scanline overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(0,0,0,0.08) 3px,
                rgba(0,0,0,0.08) 4px
            );
            pointer-events: none;
            z-index: 999;
        }

        header {
            width: 100%;
            max-width: 1100px;
            padding: 2.5rem 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            letter-spacing: 0.08em;
            color: #fff;
            line-height: 1;
        }

        h1 span {
            color: var(--accent);
            text-shadow: var(--glow);
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--dim);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .stats-bar {
            width: 100%;
            max-width: 1100px;
            padding: 0.8rem 2rem;
            display: flex;
            gap: 2rem;
            align-items: center;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        .stat {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--dim);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1rem;
            color: var(--accent);
            text-shadow: var(--glow);
            transition: color 0.2s;
        }

        #progress-wrap {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-left: auto;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 2px;
            transition: width 0.3s ease;
        }


        .grid-wrap {
            width: 100%;
            max-width: 1100px;
            padding: 1.5rem 2rem 3rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
            gap: 6px;
        }

        /* Custom checkbox */
        .cb-wrap {
            position: relative;
            width: 36px;
            height: 36px;
        }

        .cb-wrap input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .cb-wrap label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            background: var(--panel);
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
            position: relative;
            font-size: 0.5rem;
            color: var(--dim);
            user-select: none;
        }

        .cb-wrap label::after {
            content: '';
            display: block;
            width: 12px;
            height: 12px;
            background: transparent;
            border: 1px solid var(--dim);
            transition: background 0.15s, border-color 0.15s, transform 0.15s;
        }

        .cb-wrap input:checked + label {
            border-color: var(--accent);
            background: rgba(0, 255, 204, 0.06);
            box-shadow: var(--glow);
        }

        .cb-wrap input:checked + label::after {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(0.85);
            box-shadow: 0 0 6px var(--accent);
        }

        .cb-wrap label:hover {
            border-color: var(--accent);
        }

        /* pop animation on check */
        .cb-wrap input:checked + label {
            animation: pop 0.18s ease;
        }

        @keyframes pop {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        /* socket indicator */
        #socket-status {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.65rem;
            color: var(--dim);
            letter-spacing: 0.1em;
            margin-left: auto;
        }

        #socket-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--dim);
            transition: background 0.3s;
        }

        #socket-dot.connected { background: var(--accent); box-shadow: var(--glow); }
        #socket-dot.disconnected { background: var(--accent2); }

        footer {
            margin-top: auto;
            padding: 1.5rem 2rem;
            font-size: 0.6rem;
            color: var(--dim);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        /* Toast Notification System */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--panel);
            border: 1px solid var(--accent2);
            color: var(--accent2);
            padding: 1rem 1.5rem;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 45, 120, 0.2);
            z-index: 1000;
    
            /* Hidden state */
            transform: translateX(120%);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        .toast.show {
            /* Visible state */
            transform: translateX(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<header>
    <h1>1000 <span>Checkboxes</span></h1>
    <div class="subtitle">Real-time · WebSocket · Shared State</div>
</header>

<div class="stats-bar">
    <div class="stat">
        <span class="stat-label">Checked</span>
        <span class="stat-value" id="count-checked">0</span>
    </div>
    <div class="stat">
        <span class="stat-label">Remaining</span>
        <span class="stat-value" id="count-remaining">1000</span>
    </div>
    <div class="stat">
        <span class="stat-label">Progress</span>
        <span class="stat-value" id="count-pct">0%</span>
    </div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="socket-status">
        <div id="socket-dot"></div>
        <span id="socket-label">DISCONNECTED</span>
    </div>
</div>

<div class="grid-wrap">
    <div class="grid" id="grid"></div>
</div>

<footer>1000 checkboxes with sockets : local state active</footer>
<div id="toast" class="toast"></div>

<script>
    const TOTAL = 1000;
    const grid = document.getElementById('grid');
    const countChecked = document.getElementById('count-checked');
    const countRemaining = document.getElementById('count-remaining');
    const countPct = document.getElementById('count-pct');
    const progressBar = document.getElementById('progress-bar');
    const socketDot = document.getElementById('socket-dot');
    const socketLabel = document.getElementById('socket-label');

    const checks = [];
    for (let i = 0; i < TOTAL; i++) {
        const wrap = document.createElement('div');
        wrap.className = 'cb-wrap';

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.id = `cb-${i}`;

        const label = document.createElement('label');
        label.htmlFor = `cb-${i}`;

        wrap.appendChild(input);
        wrap.appendChild(label);
        grid.appendChild(wrap);
        checks.push(input);

        input.addEventListener('change', () => {
            updateStats();
            socketSend(i, input.checked);
        });
    }

    function updateStats() {
        const n = checks.filter(c => c.checked).length;
        const pct = Math.round(n / TOTAL * 100);
        countChecked.textContent = n;
        countRemaining.textContent = TOTAL - n;
        countPct.textContent = pct + '%';
        progressBar.style.width = pct + '%';
    }

    const socket = io('http://localhost:8000');

    socket.on('connect', () => {
        socketDot.classList.remove('disconnected');
        socketDot.classList.add('connected');
        socketLabel.textContent = 'CONNECTED';
    })

    socket.on('disconnect', () => {
        socketDot.classList.remove('connected');
        socketDot.classList.add('disconnected');
        socketLabel.textContent = 'DISCONNECTED';
    });

    function socketSend(index, checked) {
        socket.emit('client:checkbox:change', {
            index: index,
            checked: checked
        });
    }

    socket.on('server:checkbox:status', (stateArray) => {
        stateArray.forEach((isChecked, i) => {
            if (checks[i] && isChecked !== null) {
                checks[i].checked = isChecked;
            }
        });
        updateStats();
    });

    socket.on('server:checkbox:change', (data) => {
        if (checks[data.index]) {
            checks[data.index].checked = data.checked;
            updateStats();
        }
    });

    const toast = document.getElementById('toast');
    let toastTimeout;

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        
        clearTimeout(toastTimeout);
        
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    socket.on('server:error', (error) => {
        console.warn(error.message);
        
        if (error.data) {
            checks[error.data.index].checked = !error.data.checked;
            updateStats();
        }
        
        showToast(error.message);
    });
    
</script>
</body>
</html>
